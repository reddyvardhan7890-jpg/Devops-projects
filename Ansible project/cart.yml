- name: configure cart 
  hosts: cart
  become: yes
  tasks: 

  - name: Disable NodeJS module
    ansible.builtin.command: dnf module disable nodejs -y

  - name: Enable NodeJS 20 module
    ansible.builtin.command: dnf module enable nodejs:20 -y

  - name: install nodejs  
    ansible.builtin.dnf:
      name: nodejs 
      state: present

  - name: Create application user
    ansible.builtin.user: 
      name: movie
      system: true
      home: /app
      shell: /sbin/nologin
      comment: "Created a movie cart"

  - name: Remove old directory
    ansible.builtin.file:
      path: /app
      state: absent

  - name: create a directory
    ansible.builtin.file:
      path: /app
      state: directory
      owner: movie
      group: movie
      mode: '0755'

  - name: Remove old application archive
    ansible.builtin.file:
        path: /tmp/cart.zip
        state: absent

  - name: Download zip file
    ansible.builtin.get_url:
      url: https://roboshop-artifacts.s3.amazonaws.com/cart-v3.zip  
      dest: /tmp/cart.zip

  - name: unarchive the zip
    ansible.builtin.unarchive:
      src: /tmp/cart.zip
      dest: /app
      remote_src: yes

  - name: Change ownership of app
    ansible.builtin.file:
      path: /app
      owner: movie
      group: movie
      recurse: yes

  - name: install dependencies
    community.general.npm:
      path: /app

  - name: Copy cart service file
    ansible.builtin.template:
      src: cart.service.j2
      dest: /etc/systemd/system/cart.service
      owner: root
      group: root
      mode: '0644'

  - name: daemon reload
    ansible.builtin.systemd:
      daemon_reload: yes

  - name: Enable and start cart service
    ansible.builtin.systemd:
      name: cart
      state: restarted
      enabled: yes